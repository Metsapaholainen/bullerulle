universe:
  min_price: 2.0
  min_market_cap: 50000000
  max_market_cap: 0
  min_avg_dollar_volume: 3000000
  exchanges:
  - NASDAQ
  - NYSE
  - AMEX
  exclude_etf: true
  exclude_funds: true
  max_symbols: 6000
  momentum_timeframes_days:
  - 21
  - 63
  - 126
  - 252
  - 378
  momentum_top_pct: 2.0
ep:
  enabled: true
  min_gap_pct: 10.0
  min_volume_ratio: 3.0
  volume_avg_period: 50
  lookback_base_days: 20
  max_prior_range_pct: 20.0
  min_price: 1.0
  quiet_base_lookback_days: 100
  max_quiet_base_run_pct: 40.0
  prior_ep_lookback_days: 252
  prior_ep_min_gap_pct: 8.0
  max_prior_ep_count: 0
  min_growth_pct_floor: 25.0
  ideal_growth_pct: 100.0
  require_growth_floor: true
  min_eps_beat_pct_for_bonus: 20.0
  require_eps_beat: false
  catalyst_earnings_window_days: 1
  enable_catalyst_classifier: true
  min_catalyst_confidence: 0.5
  catalyst_bonus_weight: 2.0
  enable_social_sentiment: false
  social_sentiment_spike_threshold: 2.0
backtest:
  initial_capital: 100000
  risk_pct_per_trade: 1.0
  commission_per_share: 0.0
  slippage_pct: 0.1
  stop_mode: low_of_signal_day
  stop_adr_multiple: 1.0
  stop_exceeds_adr_action: cap
  entry_mode: stop_buy
  entry_buffer_pct: 0.05
  max_gap_fill_pct: 2.5
  check_same_bar_stop: false
  partial_profit_r_multiple: 1.0
  partial_profit_fraction: 0.5
  partial_profit_max_days: 5
  move_stop_to_breakeven_after_partial: true
  trail_ema_period: 10
  trail_ma_type: sma
  max_positions: 10
  max_position_pct_of_equity: 20.0
  avoid_chase_adr_multiple: 1.5
  entry_delay_days: 1
  max_position_pct_of_avg_volume: 1.0
  ep_stop_mode_override: null
  regime_filter_enabled: false
  regime_drawdown_lookback_days: 252
  regime_max_drawdown_pct: -15.0
  regime_vol_lookback_days: 20
  regime_vol_percentile_window_days: 504
  regime_vol_percentile_threshold: 85.0
  regime_combine_mode: any
  regime_action: downsize
  regime_size_multiplier: 0.5
  regime_apply_to_short: false
